<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miguel Rojas González — CV</title>
<style>
/* ════════════════════════════════════════════════════════════════════
   FUENTES — display con carácter (Familjen Grotesk vía system fallback no
   disponible offline, así que usamos una pila tipográfica robusta)
   • Display: 'Archivo Black' style → fallback a fuente condensada del sistema
   • Body: humanista neutra pero NO Arial/Inter
   Para máxima personalidad sin red, se usan stacks de sistema cuidadas.
   ════════════════════════════════════════════════════════════════════ */
:root{
  --font-display:"Bahnschrift","DIN Alternate","Oswald","Arial Narrow",
                 "Helvetica Neue Condensed",sans-serif;
  --font-body:"Avenir Next","Segoe UI","Optima","Gill Sans","Lucida Grande",
              system-ui,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono","Consolas","Roboto Mono",monospace;

  /* ── Acento (editable / preset) ── */
  --accent:#4a6fa5;
  --accent-2:#6a9c92;

  /* ── Tema claro (por defecto) ── */
  --bg:#faf9f5;
  --bg-card:#ffffff;
  --bg-soft:#f1efe8;
  --ink:#23262b;
  --ink-soft:#6b7079;
  --line:#e4e1d8;
  --grid:#eeece4;
  --shadow:0 1px 2px rgba(20,22,26,.03),0 8px 24px rgba(20,22,26,.05);
  /* familias de actividad (paleta apagada y coherente, legible sobre claro) */
  --cat-aos:#5878a8;        /* AOS Central & Training — azul apagado */
  --cat-training:#4f928a;   /* Formación · Consultoría — teal apagado */
  --cat-digital:#8071a8;    /* CAD/CAM/PDM · IT · Digital — violeta apagado */
  --cat-realestate:#b08753; /* Real Estate · Construcción — arena */
  --cat-pm:#4f7e9e;         /* Project Mgmt · Capex — azul petróleo suave */
  --cat-business:#b06a76;   /* Negocio · Emprendimiento — granate apagado */
  --cat-facility:#5e9069;   /* Facility Management — verde salvia */
  --cat-perf:#bf8362;       /* Performance & Improvement Planta — terracota suave */
}
[data-theme="dark"]{
  --bg:#0e1014;
  --bg-card:#171a20;
  --bg-soft:#1e222a;
  --ink:#f2f1ec;
  --ink-soft:#9aa0ab;
  --line:#2a2f38;
  --grid:#1c2027;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.5);
  --accent:#7d9bc4;
  --accent-2:#8ab3a9;
  --cat-aos:#7d9bc4;
  --cat-training:#76b3aa;
  --cat-digital:#a294c4;
  --cat-realestate:#cba877;
  --cat-pm:#79a2c0;
  --cat-business:#cc9099;
  --cat-facility:#84b48d;
  --cat-perf:#cda285;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background .4s ease,color .4s ease;
}

/* ════════ LAYOUT ════════ */
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}

/* ════════ NAV SUPERIOR ════════ */
nav.topnav{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topnav-inner{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  max-width:1240px;margin:0 auto;padding:10px 28px;
}
.topnav .brand{
  font-family:var(--font-display);font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;font-size:13px;margin-right:auto;
}
.topnav .brand b{color:var(--accent)}
.navlinks{display:flex;gap:2px;flex-wrap:wrap}
.navlinks a{
  font-family:var(--font-mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-soft);text-decoration:none;
  padding:6px 10px;border-radius:6px;transition:.2s;
}
.navlinks a:hover{color:var(--ink);background:var(--bg-soft)}

/* botones de control */
.ctrl{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-family:var(--font-mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--ink);background:var(--bg-card);
  border:1px solid var(--line);padding:6px 11px;border-radius:7px;
  transition:.2s;user-select:none;
}
.ctrl:hover{border-color:var(--accent);color:var(--accent)}
.ctrl svg{width:14px;height:14px}
.toggle-lang b{color:var(--accent)}

/* ════════ CABECERA ════════ */
header.hero{padding:48px 0 32px}
.hero-top{
  display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;
  padding-bottom:30px;margin-bottom:30px;border-bottom:1px solid var(--line);
}
.photo-frame{
  position:relative;width:215px;height:269px;flex-shrink:0;
  border:1px solid var(--line);padding:8px;background:var(--bg-card);
  box-shadow:var(--shadow);
}
.photo-frame::before{
  content:"";position:absolute;inset:-1px;
  border:1px solid var(--accent);transform:translate(10px,10px);z-index:-1;
  transition:transform .3s;
}
.photo-frame:hover::before{transform:translate(14px,14px)}
.photo-frame img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.15) contrast(1.02)}
.photo-frame .tag{
  position:absolute;bottom:-12px;left:8px;background:var(--accent);color:#fff;
  font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;padding:3px 8px;
}
.hero-id{min-width:0}
.hero-id .eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero-id h1{
  font-family:var(--font-display);font-weight:700;line-height:.92;
  font-size:clamp(38px,6vw,76px);letter-spacing:-.01em;text-transform:uppercase;
}
.hero-id h1 .ln2{color:var(--ink-soft)}
/* descripción a dos columnas, a todo el ancho bajo la fila de identidad */
.headline{
  font-size:clamp(14.5px,1.4vw,17px);line-height:1.7;margin:0 0 4px;
  color:var(--ink);font-weight:450;
  columns:2;column-gap:48px;column-fill:balance;
}
.headline .hl-p{display:block;margin-bottom:13px}
.headline .hl-p:last-child{margin-bottom:0}
.hero-meta{
  display:flex;flex-wrap:wrap;gap:7px 22px;margin-top:18px;
  font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);
  letter-spacing:.02em;
}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta svg{width:14px;height:14px;color:var(--accent)}
/* contacto en texto (WhatsApp / WeChat / email) */
.hero-contact{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.contact-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--bg-card);border:1px solid var(--line);border-radius:10px;
  padding:7px 11px;box-shadow:var(--shadow);transition:.2s;text-decoration:none;color:var(--ink);
}
.contact-chip:hover{border-color:var(--accent);transform:translateY(-2px)}
.contact-chip .ico{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;flex:none;
}
.contact-chip .ico svg{width:16px;height:16px}
.contact-chip .txt{display:flex;flex-direction:column;line-height:1.25}
.contact-chip .txt b{
  font-family:var(--font-mono);font-size:9px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-soft);font-weight:600;
}
.contact-chip .txt span{font-family:var(--font-mono);font-size:11.5px;color:var(--ink);font-weight:500}
.hero-social{display:none}
.hero-social a{
  display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-family:var(--font-mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--ink);background:var(--bg-card);
  border:1px solid var(--line);padding:8px 13px;border-radius:8px;transition:.2s;
}
.hero-social a:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.hero-social svg{width:15px;height:15px}
.hero-social a.linkedin{background:var(--accent);color:#fff;border-color:var(--accent)}
.hero-social a.linkedin:hover{filter:brightness(1.1);color:#fff}

/* ════════ MÉTRICAS CABECERA ════════ */
.metrics{
  display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin:30px 0 8px;
}
.metrics .metric:nth-child(1){grid-column:span 4}
.metrics .metric:nth-child(2){grid-column:span 8}
.metrics .metric:nth-child(3){grid-column:span 7}
.metrics .metric:nth-child(4){grid-column:span 5}
.metric.wide .lbl{column-count:2;column-gap:28px}
.metric:nth-child(4).wide .lbl{column-count:1}
.metric{
  background:var(--bg-card);border:1px solid var(--line);border-radius:12px;
  padding:18px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow);
}
.metric::after{
  content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent);
}
.metric .num{
  font-family:var(--font-display);font-weight:700;font-size:clamp(30px,4vw,42px);
  line-height:1;letter-spacing:-.02em;
}
.metric .num.txt{font-size:clamp(20px,2.2vw,26px);line-height:1.05}
.metric .num small{font-size:.5em;color:var(--accent);margin-left:2px}
.metric .num.txt small{font-size:.55em}
.metric .lbl{
  font-family:var(--font-mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-soft);margin-top:8px;line-height:1.35;
}
.metric.long .lbl{
  text-transform:none;letter-spacing:.01em;font-size:10.5px;line-height:1.5;
  font-family:var(--font-body);
}
.metric.long .lbl b{color:var(--ink);font-weight:600}

/* ════════ SECCIONES ════════ */
section.block{margin:42px 0;scroll-margin-top:70px}
.sec-head{
  display:flex;align-items:baseline;gap:14px;cursor:pointer;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px;
  user-select:none;
}
.sec-head .idx{
  font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:700;
}
.sec-head h2{
  font-family:var(--font-display);font-weight:700;text-transform:uppercase;
  font-size:clamp(22px,3vw,32px);letter-spacing:.01em;line-height:1;
}
.sec-head .chev{
  margin-left:auto;width:22px;height:22px;color:var(--ink-soft);transition:transform .3s;
}
.sec-head.collapsed .chev{transform:rotate(-90deg)}
.sec-sub{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);
  margin:8px 0 22px;letter-spacing:.02em;
}
.sec-body{
  overflow:hidden;transition:max-height .45s ease,opacity .35s ease;
  max-height:8000px;opacity:1;
}
.sec-body.collapsed{max-height:0;opacity:0;margin:0}

/* ════════ TIMELINE EXPERIENCIA ════════ */
/* ════════ TIMELINE (eje de evolución temporal) ════════ */
.timeline{position:relative;padding-left:74px;margin-top:14px;padding-top:30px;padding-bottom:34px}
/* eje vertical: gradiente que sube de la familia base (origen) al acento (hoy) */
.timeline::before{
  content:"";position:absolute;left:54px;top:0;bottom:0;width:2px;
  background:linear-gradient(to top,var(--accent-2),var(--accent));
  border-radius:2px;
}
/* etiquetas extremas del eje */
.tl-axis-cap{
  position:absolute;left:54px;transform:translateX(-50%);
  font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:2;
}
.tl-axis-now{top:-2px;transform:translate(-50%,-50%);background:var(--accent);color:#fff;
  box-shadow:0 0 0 4px var(--bg),0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.tl-axis-start{bottom:18px;transform:translate(-50%,50%);background:var(--bg-soft);
  color:var(--ink-soft);border:1px solid var(--line)}
/* flecha ascendente al pie del eje: marca la dirección de la evolución */
.tl-arrow{
  position:absolute;left:54px;bottom:-4px;transform:translateX(-50%);
  width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
  border-bottom:12px solid var(--accent-2);z-index:2;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));
}

.tl-item{position:relative;padding:0 0 22px 0}
.tl-item:last-of-type{padding-bottom:0}
/* año-ancla grande a la izquierda del eje */
.tl-year{
  position:absolute;left:-74px;top:2px;width:46px;text-align:right;
  font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1;
  color:var(--c,var(--accent));letter-spacing:-.02em;
  transition:.3s;
}
.tl-item:hover .tl-year{transform:scale(1.12);transform-origin:right center}
/* nodo sobre el eje */
.tl-item::before{
  content:"";position:absolute;left:-21px;top:5px;width:13px;height:13px;
  border-radius:50%;background:var(--bg);border:3px solid var(--c,var(--accent));
  box-shadow:0 0 0 3px var(--bg);transition:.3s;z-index:1;
}
.tl-item:hover::before{background:var(--c,var(--accent));transform:scale(1.25)}
/* posición actual: nodo con pulso y año destacado */
.tl-item.is-now::before{background:var(--c,var(--accent))}
.tl-item.is-now .tl-year{font-size:21px}
.tl-item.is-now::after{
  content:"";position:absolute;left:-21px;top:5px;width:13px;height:13px;border-radius:50%;
  background:var(--c,var(--accent));z-index:0;animation:tlPulse 2.4s ease-out infinite;
}
@keyframes tlPulse{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.tl-item.is-now::after{animation:none}}

.tl-card{
  background:var(--bg-card);border:1px solid var(--line);border-radius:12px;
  border-left:3px solid var(--c,var(--accent));
  padding:14px 18px 14px 16px;box-shadow:var(--shadow);transition:.25s;
  cursor:pointer;
}
.tl-card:hover{transform:translateX(4px);border-color:var(--c,var(--accent))}
.tl-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.tl-date{
  font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:var(--c,var(--accent));
  letter-spacing:.04em;white-space:nowrap;
  background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent);
  padding:2px 8px;border-radius:20px;
}
.tl-role{font-family:var(--font-display);font-weight:700;font-size:17px;
  text-transform:uppercase;letter-spacing:.01em;line-height:1.1}
.tl-org{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);
  letter-spacing:.03em;margin-left:auto;text-transform:uppercase;
}
.tl-toggle{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;flex:none;
  color:var(--c,var(--accent));
  background:color-mix(in srgb,var(--c,var(--accent)) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--c,var(--accent)) 22%,transparent);
  transition:transform .35s cubic-bezier(.22,1,.36,1),background .25s ease;
  align-self:center;
}
.tl-card:hover .tl-toggle{background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent)}
.tl-card.open .tl-toggle{transform:rotate(180deg)}
.tl-detail{
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .4s ease,opacity .3s ease,margin .3s ease;
  font-size:13.5px;color:var(--ink);
}
.tl-card.open .tl-detail{max-height:720px;opacity:1;margin-top:10px}
.tl-detail ul{list-style:none;display:grid;gap:6px}
.tl-detail li{position:relative;padding-left:16px}
.tl-detail li::before{
  content:"▸";position:absolute;left:0;color:var(--c,var(--accent));font-size:11px;top:2px;
}
/* badge de hito destacado */
.tl-detail .hit{
  background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);
  color:var(--ink);font-weight:700;border-radius:5px;padding:0 6px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
  border:1px solid color-mix(in srgb,var(--c,var(--accent)) 38%,transparent);
}
.tl-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;align-items:center}
.tl-tags span{
  font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.05em;background:var(--bg-soft);color:var(--ink-soft);
  padding:3px 7px;border-radius:5px;border:1px solid var(--line);
}
.tl-tags .cat-tag{
  background:color-mix(in srgb,var(--c) 14%,transparent);
  color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,transparent);
  font-weight:700;
}

/* ════════ PESTAÑAS (Trayectoria) ════════ */
.tabs-bar{display:inline-flex;gap:4px;background:var(--bg-soft);
  border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:14px}
.tab-btn{
  font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-soft);background:transparent;border:none;
  padding:8px 16px;border-radius:8px;cursor:pointer;transition:.2s;font-weight:600;
}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{background:var(--bg-card);color:var(--ink);box-shadow:var(--shadow)}
.tab-panel{display:none;animation:fadeTab .35s ease}
.tab-panel.active{display:block}
@keyframes fadeTab{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* leyenda de familias */
.tab-ach{margin:0 0 22px}
.cat-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 18px}
.cat-key{display:inline-flex;align-items:center;gap:7px;
  font-family:var(--font-mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--ink-soft)}
.cat-key i{width:12px;height:12px;border-radius:4px;flex:none}

/* ════════ SKILLS / CLUSTERS ════════ */
.cluster-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cluster-grid.print-only{display:none}
/* carrusel de skills: cada cluster a ancho fijo */
.cl-carousel .cluster{flex:0 0 300px;width:300px;align-self:stretch}
.cl-track{align-items:stretch}
.cluster{
  background:var(--bg-card);border:1px solid var(--line);border-radius:12px;
  padding:15px 16px;box-shadow:var(--shadow);
}
.cluster h3{
  font-family:var(--font-display);font-weight:700;text-transform:uppercase;
  font-size:13px;letter-spacing:.04em;margin-bottom:11px;
  display:flex;align-items:center;gap:8px;
}
.cluster h3 svg{width:15px;height:15px;color:var(--accent)}
.skill{margin-bottom:10px}
.skill:last-child{margin-bottom:0}
.skill .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;gap:8px}
.skill .row b{font-weight:600}
.skill .row em{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-soft);font-style:normal;white-space:nowrap}
.bar{height:6px;background:var(--bg-soft);border-radius:99px;overflow:hidden}
.bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width 1.1s cubic-bezier(.2,.8,.2,1);
}

/* ════════ LOGROS — TARJETAS ════════ */
.ach-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.ach-grid.print-only{display:none}

/* ── Carrusel de logros (auto-scroll) ── */
.ach-carousel{
  overflow:hidden;position:relative;margin:0 0 4px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
}
.ach-track{display:flex;gap:14px;width:max-content;will-change:transform;user-select:none;-webkit-user-select:none}
.ach-carousel .ach{
  flex:0 0 300px;width:300px;grid-column:auto;
}
.ach-carousel .ach.wide{flex-basis:440px;width:440px}
.ach-carousel .ach.full{flex-basis:560px;width:560px}

.ach{
  background:var(--bg-card);border:1px solid var(--line);border-radius:12px;
  padding:20px 18px;box-shadow:var(--shadow);transition:.25s;position:relative;overflow:hidden;
  grid-column:span 4;
}
.ach.wide{grid-column:span 8}
.ach.full{grid-column:1 / -1}
.ach:hover{transform:translateY(-4px);border-color:var(--accent)}
.ach .big{
  font-family:var(--font-display);font-weight:700;font-size:40px;line-height:.95;
  letter-spacing:-.02em;color:var(--accent);
}
.ach .big.big-md{font-size:31px}
.ach .big.big-sm{font-size:25px}
.ach .big small{font-size:.45em;color:var(--ink)}
.ach .imp{font-size:13px;margin-top:8px;color:var(--ink);line-height:1.45}
.ach .imp b{font-weight:700;color:var(--accent)}

/* ════════ FORMACIÓN / IDIOMAS / GRID GENÉRICO ════════ */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.edu-twocol{grid-template-columns:1.75fr 1fr;align-items:stretch}
.edu-list{columns:2;column-gap:20px;column-fill:balance}
.edu-twocol .edu-item{margin-bottom:9px}
/* idiomas: repartir los items para llenar la misma altura que académico */
.edu-twocol > div:last-child{display:flex;flex-direction:column}
.lang-wrap{display:flex;flex-direction:column;justify-content:space-between;flex:1;gap:10px}
.edu-item{
  border-left:3px solid var(--accent);padding:2px 0 2px 14px;margin-bottom:16px;
  break-inside:avoid;
}
.edu-item .y{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);letter-spacing:.05em}
.edu-item .t{font-weight:600;font-size:13.5px;margin:2px 0}
.edu-item .d{font-size:12px;color:var(--ink-soft)}

.lang-item{margin-bottom:16px}
.lang-item .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.lang-item .row b{font-weight:600}
.lang-item .row em{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);font-style:normal}
.dots{display:flex;gap:5px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--accent);background:transparent}
.dots i.on{background:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{
  font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
  background:var(--bg-soft);border:1px solid var(--line);color:var(--ink);
  padding:5px 10px;border-radius:7px;transition:.2s;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}

.values-line{
  font-family:var(--font-display);text-transform:uppercase;font-weight:700;
  font-size:clamp(16px,2.4vw,26px);line-height:1.3;letter-spacing:.01em;color:var(--ink-soft);
}
.values-line b{color:var(--ink)}

.list-clean{list-style:none;display:grid;gap:9px}
.list-clean li{position:relative;padding-left:22px;font-size:13.5px}
.list-clean li svg{position:absolute;left:0;top:2px;width:15px;height:15px;color:var(--accent)}

/* ════════ PIE ════════ */
footer{
  border-top:1px solid var(--line);margin-top:54px;padding:28px 0 60px;
}
.foot-inner{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.foot-inner .fbrand{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.foot-social{display:flex;gap:10px;margin-left:auto}
.foot-social a{color:var(--ink-soft);transition:.2s}
.foot-social a:hover{color:var(--accent)}
.foot-social svg{width:20px;height:20px}
.foot-note{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);width:100%;margin-top:8px;letter-spacing:.04em}
.print-close{display:none}

/* ════════ PANEL DE CONFIGURACIÓN ════════ */
.cfg-toggle{
  position:fixed;bottom:22px;right:22px;z-index:60;width:50px;height:50px;
  border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;
  box-shadow:0 6px 20px rgba(10,92,255,.4);display:flex;align-items:center;justify-content:center;
  transition:transform .3s;
}
.cfg-toggle:hover{transform:rotate(45deg) scale(1.05)}
.cfg-toggle svg{width:22px;height:22px}
.cfg-panel{
  position:fixed;bottom:84px;right:22px;z-index:60;width:260px;
  background:var(--bg-card);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.18);padding:18px;
  transform:translateY(20px) scale(.96);opacity:0;pointer-events:none;transition:.3s;
}
.cfg-panel.open{transform:none;opacity:1;pointer-events:auto}
.cfg-panel h4{
  font-family:var(--font-display);text-transform:uppercase;font-size:13px;
  letter-spacing:.05em;margin-bottom:14px;
}
.cfg-row{margin-bottom:15px}
.cfg-row > span{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--ink-soft);display:block;margin-bottom:7px}
.cfg-opts{display:flex;gap:6px;flex-wrap:wrap}
.cfg-opts button{
  flex:1;min-width:fit-content;font-family:var(--font-mono);font-size:11px;
  padding:7px 8px;border-radius:7px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);cursor:pointer;transition:.2s;text-transform:uppercase;letter-spacing:.03em;
}
.cfg-opts button:hover{border-color:var(--accent)}
.cfg-opts button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.swatch{display:flex;gap:8px}
.swatch button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none}
.swatch button.active{border-color:var(--ink)}

/* ════════ APARICIÓN ESCALONADA ════════ */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}

/* ════════ RESPONSIVE ════════ */
@media(max-width:820px){
  .hero-top{grid-template-columns:1fr;gap:24px;justify-items:start}
  .headline{columns:1}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .metrics .metric:nth-child(1),.metrics .metric:nth-child(2),
  .metrics .metric:nth-child(3),.metrics .metric:nth-child(4){grid-column:auto}
  .metric.wide{grid-column:span 2 !important}
  .metric.wide .lbl{column-count:2}
  .cluster-grid{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .edu-list{columns:1}
  .ach-grid{grid-template-columns:1fr 1fr}
  .ach,.ach.wide,.ach.full{grid-column:auto}
  .navlinks{display:none}
}
@media(max-width:520px){
  .cluster-grid{grid-template-columns:1fr}
  .ach-grid{grid-template-columns:1fr}
  .ach,.ach.wide,.ach.full{grid-column:auto}
  .metrics{grid-template-columns:1fr}
  .metric.wide{grid-column:auto !important}
  .metric.wide .lbl{column-count:1}
  /* carril temporal más estrecho en móvil */
  .timeline{padding-left:56px}
  .timeline::before{left:40px}
  .tl-axis-cap,.tl-arrow{left:40px}
  .tl-year{left:-56px;width:34px;font-size:16px}
  .tl-item::before,.tl-item.is-now::after{left:-19px}
}

/* ════════════════════════════════════════════════════════════════════
   IMPRESIÓN A4 DOBLE CARA
   ════════════════════════════════════════════════════════════════════ */
@media print{
  @page{size:A4;margin:9mm 12mm}
  :root{
    --bg:#fff;--bg-card:#fff;--bg-soft:#f1f1f1;--ink:#000;--ink-soft:#444;
    --line:#bbb;--grid:transparent;--shadow:none;
  }
  body{background:#fff !important;background-image:none !important;font-size:9.5px}
  nav.topnav,.cfg-toggle,.cfg-panel,.hero-social,.sec-head .chev{display:none !important}
  .sec-body,.sec-body.collapsed{max-height:none !important;opacity:1 !important;margin:0 !important}
  .tl-detail{max-height:none !important;opacity:1 !important;margin-top:6px !important}
  .reveal{opacity:1 !important;transform:none !important}
  .bar i{transition:none !important}
  header.hero{padding:0 0 8px}
  section.block{margin:4px 0;page-break-inside:auto;scroll-margin-top:0}
  .sec-head{break-after:avoid;padding-bottom:4px;margin-bottom:3px}
  .sec-head h2{font-size:17px}
  .sec-sub{margin:3px 0 7px;font-size:9px}
  .tl-item,.tl-card,.ach,.metric,.edu-item{page-break-inside:avoid}
  .photo-frame::before{display:none}
  a{color:#000 !important;text-decoration:none}
  .wrap{max-width:100%;padding:0}
  .photo-frame{width:120px;height:150px}
  .hero-top{gap:22px;padding-bottom:12px;margin-bottom:12px}
  .hero-id h1{font-size:40px}
  .headline{columns:2;column-gap:28px;font-size:9.5px;line-height:1.45}
  .headline .hl-p{margin-bottom:7px}
  .hero-meta{margin-top:10px;font-size:10px;gap:4px 16px}
  .hero-contact{margin-top:10px;gap:8px}
  .contact-chip{padding:4px 8px}
  .contact-chip .ico{width:20px;height:20px}
  .contact-chip .ico svg{width:13px;height:13px}
  /* métricas en print: 2 datos arriba + sedes y departamentos a ancho completo */
  .metrics{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 5px}
  .metrics .metric{grid-column:auto !important}
  .metrics .metric:nth-child(1){flex:1 1 32%;order:1}
  .metrics .metric:nth-child(2){flex:2 1 60%;order:2}
  .metrics .metric:nth-child(3){flex:1 1 100%;order:3}
  .metrics .metric:nth-child(4){flex:1 1 100%;order:4}
  .metric{padding:7px 10px}
  .metric .num{font-size:22px}
  .metric .num.txt{font-size:15px}
  .metric .lbl{font-size:8px;margin-top:3px}
  .metric.long .lbl{font-size:8.5px;line-height:1.38}
  .metric:nth-child(3).wide .lbl{column-count:3;column-gap:18px}
  .metric:nth-child(4).wide .lbl{column-count:2;column-gap:18px}
  .metric::after{background:#000}
  /* timeline más compacto (grid 2-col, sin eje) */
  .timeline{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start;
    padding:0 !important;margin-top:6px}
  .timeline::before,.tl-arrow,.tl-axis-cap{display:none !important}
  .tl-item{padding:0;break-inside:avoid}
  .tl-item::before,.tl-item.is-now::after{display:none !important}
  .tl-year{display:none !important}
  .tl-card{padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--c,#000)}
  .tl-top{gap:3px 8px}
  .tl-date{font-size:9px;color:var(--c,#000);background:none;padding:0}
  .tl-role{font-size:12px}
  .tl-org{font-size:9px}
  .tl-detail{display:none}
  .tl-tags{display:none}
  /* pestañas en print: ocultar botones, mostrar ambos paneles con rótulo */
  .tabs-bar{display:none !important}
  .tab-panel{display:block !important;break-inside:auto;animation:none !important;opacity:1 !important;transform:none !important}
  .tab-panel+.tab-panel{margin-top:8px}
  .tab-panel::before{
    content:attr(data-label);display:block;
    font-family:var(--font-display);text-transform:uppercase;font-weight:700;
    font-size:12px;letter-spacing:.03em;margin:0 0 6px;color:var(--ink);
    border-bottom:1px solid var(--line);padding-bottom:4px;
  }
  .cat-legend{gap:4px 12px;margin-bottom:8px}
  .cat-key{font-size:8.5px}
  .cat-key i{width:9px;height:9px}
  /* clusters/logros compactos */
  .cluster-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .cluster-grid.print-only{display:grid !important}
  .cluster-grid .cluster{flex:none;width:auto}
  .cluster{padding:9px 11px}
  .cluster h3{margin-bottom:6px;font-size:11px}
  .skill{margin-bottom:5px}
  .skill .row{font-size:9px;margin-bottom:2px}
  .bar{height:4px}
  /* logros: en PDF se ocultan los carruseles y se muestra el mosaico completo */
  .ach-carousel{display:none !important}
  .ach-grid.print-only{display:grid !important}
  .ach-grid{grid-template-columns:repeat(12,1fr);gap:6px}
  .ach-grid .ach{padding:8px 10px;grid-column:span 4;width:auto;flex:none}
  .ach-grid .ach.wide{grid-column:span 8}
  .ach-grid .ach.full{grid-column:1 / -1}
  .ach .big{font-size:20px}
  .ach .big.big-md{font-size:16px}
  .ach .big.big-sm{font-size:14px}
  .ach .imp{font-size:8px;margin-top:2px;line-height:1.3}
  .two-col{gap:16px}
  .two-col > div:first-child{columns:2;column-gap:18px}
  .two-col > div:first-child > h3{column-span:all}
  .edu-item{margin-bottom:6px;break-inside:avoid}
  .edu-item .t{font-size:11px}
  .edu-item .d{font-size:9.5px}
  .chips .chip{font-size:8.5px;padding:3px 7px}
  .values-line{font-size:11px;padding:9px 12px}
  .lang-item{margin-bottom:5px}
  .lang-item .row{font-size:10px;margin-bottom:1px}
  .dots i{width:8px;height:8px}
  .list-clean{gap:5px}
  .cluster h3{margin-bottom:6px;font-size:11px}
  .list-clean li{font-size:8.5px;padding-left:15px}
  .list-clean{gap:4px}
  #extra .cluster[style]{margin-bottom:6px !important}
  #extra .cluster h3[style]{margin-top:6px !important}
  .chips{gap:3px;margin-top:3px}
  .chips .chip{font-size:7.5px;padding:2px 5px}
  .values-line{font-size:9.5px;padding:5px 9px}
  .cluster{padding:8px 10px}
  /* pie compacto: evita una 4ª cara solo para el footer */
  footer{margin-top:2px;padding:2px 0 0;border-top:.5px solid var(--line)}
  .foot-social{display:none}
  .foot-inner .fbrand{font-size:9px}
  .foot-note{margin-top:1px;font-size:8px}
  section.block:last-of-type{margin-bottom:0}

  /* ══════════════════════════════════════════════════════════════
     MODO PDF "2 CARAS" (body.printing) — layout optimizado a 2 págs
     ══════════════════════════════════════════════════════════════ */
  /* ══════════════════════════════════════════════════════════════
     MODO PDF "2 CARAS" — diseño limpio, legible y compensado
     Escala tipográfica coherente · ritmo vertical consistente
     ══════════════════════════════════════════════════════════════ */
  body.printing{font-size:9.2px;line-height:1.5}
  body.printing .wrap{max-width:100%}
  body.printing section.block{margin:0 0 9px}
  /* jerarquía de cabeceras de sección */
  body.printing .sec-head{padding-bottom:4px;margin-bottom:7px;border-bottom:1.5px solid var(--ink)}
  body.printing .sec-head .idx{font-size:11px}
  body.printing .sec-head h2{font-size:15px;letter-spacing:.01em}
  body.printing .sec-sub{margin:0 0 9px;font-size:8.4px;color:var(--ink-soft)}

  /* ── CABECERA: foto integrada · identidad+contacto a la derecha · moto a todo el ancho ── */
  body.printing .hero{display:grid;grid-template-columns:118px 1fr;grid-template-rows:auto auto;
    column-gap:20px;row-gap:14px;align-items:start;padding-bottom:14px;margin-bottom:16px;
    border-bottom:1.5px solid var(--line)}
  body.printing .hero-top{display:contents}
  body.printing .photo-frame{grid-column:1;grid-row:1;width:118px;height:148px;align-self:start;margin:0}
  body.printing .hero-id{grid-column:2;grid-row:1;align-self:start}
  body.printing .hero-id h1{font-size:33px;line-height:1.0;letter-spacing:-.01em}
  body.printing .eyebrow{font-size:9px;letter-spacing:.18em;margin-bottom:4px}
  body.printing .hero-meta{margin-top:9px;font-size:8.6px;gap:3px 16px;line-height:1.5}
  /* contacto: 4 chips equilibrados en una fila */
  body.printing .hero-contact{margin-top:10px;gap:7px;flex-wrap:nowrap}
  body.printing .hero-contact .contact-chip{padding:5px 9px;flex:1 1 0;min-width:0;border-radius:9px}
  body.printing .hero-contact .contact-chip .ico{width:22px;height:22px;border-radius:6px}
  body.printing .hero-contact .contact-chip .ico svg{width:13px;height:13px}
  body.printing .hero-contact .contact-chip .txt{min-width:0;overflow:hidden;line-height:1.3}
  body.printing .hero-contact .contact-chip .txt b{font-size:7px}
  body.printing .hero-contact .contact-chip .txt span{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* moto: a todo el ancho, dos columnas con aire */
  body.printing .headline{grid-column:1 / -1;grid-row:2;columns:2;column-gap:28px;
    column-fill:balance;font-size:9px;line-height:1.62;margin:0;color:var(--ink)}
  body.printing .headline .hl-p{margin-bottom:8px}
  body.printing .headline .hl-p:last-child{margin-bottom:0}

  /* ── CAREER PATH (logros) Airbus: mosaico puzle, cards de altura uniforme (≤2 líneas) ── */
  body.printing #trayectoria .tab-panel[data-panel="propios"]{display:none !important}
  body.printing #trayectoria .tab-ach{margin:0 0 9px}
  body.printing #trayectoria .tab-ach .ach-grid.print-only{
    display:grid !important;grid-template-columns:repeat(12,1fr);
    grid-auto-rows:1fr;gap:7px;align-items:stretch}
  body.printing #trayectoria .tab-ach .ach{
    grid-column:span 3;padding:6px 10px;display:flex;flex-direction:column;gap:1px;
    justify-content:center;border-radius:9px;min-height:38px}
  /* puzle equilibrado: 8 cards · filas parejas */
  body.printing #trayectoria .tab-ach .ach:nth-child(1){grid-column:span 3}
  body.printing #trayectoria .tab-ach .ach:nth-child(2){grid-column:span 6}
  body.printing #trayectoria .tab-ach .ach:nth-child(3){grid-column:span 3}
  body.printing #trayectoria .tab-ach .ach:nth-child(4){grid-column:span 3}
  body.printing #trayectoria .tab-ach .ach:nth-child(5){grid-column:span 3}
  body.printing #trayectoria .tab-ach .ach:nth-child(6){grid-column:span 6}
  body.printing #trayectoria .tab-ach .ach:nth-child(7){grid-column:span 6}
  body.printing #trayectoria .tab-ach .ach.wide,
  body.printing #trayectoria .tab-ach .ach.full{grid-column:span 6}
  body.printing .tab-ach .ach .big{font-size:16px;line-height:1;font-weight:700}
  body.printing .tab-ach .ach .big.big-md{font-size:12.5px}
  body.printing .tab-ach .ach .big.big-sm{font-size:11px}
  body.printing .tab-ach .ach .big small{font-size:.5em}
  body.printing .tab-ach .ach .imp{font-size:7.4px;margin-top:0;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* las cards anchas pueden permitir 2 líneas cómodas */
  body.printing .tab-ach .ach[class*="span 6"] .imp,
  body.printing .tab-ach .ach.wide .imp{-webkit-line-clamp:2}

  /* ── TRAYECTORIA: timeline vertical con eje (como la web), compacto y ordenado ── */
  body.printing #trayectoria .tab-panel[data-panel="airbus"]::before{content:none}
  body.printing #trayectoria .cat-legend{display:none !important}
  body.printing #trayectoria .timeline{
    display:block;position:relative;padding:2px 0;margin:0;grid-template-columns:none}
  body.printing #trayectoria .timeline::before,
  body.printing #trayectoria .tl-arrow,
  body.printing #trayectoria .tl-axis-cap{display:none !important}
  body.printing #trayectoria .tl-item{
    position:relative;padding:0 0 4px 52px;break-inside:avoid;display:block}
  body.printing #trayectoria .tl-item:last-of-type{padding-bottom:0}
  body.printing #trayectoria .tl-item::before{display:none !important}
  /* AÑO DE INICIO: cabecera evidente a la izquierda de cada rol */
  body.printing #trayectoria .tl-year{
    display:block !important;position:absolute;left:0;top:0;width:44px;text-align:left;
    font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1.05;color:var(--ink)}
  body.printing #trayectoria .tl-card{
    padding:0;border:none;border-left:none;background:none;box-shadow:none}
  body.printing #trayectoria .tl-top{display:block;line-height:1.25}
  body.printing #trayectoria .tl-toggle{display:none !important}
  body.printing #trayectoria .tl-date{display:none}
  body.printing #trayectoria .tl-role{
    display:inline;font-family:var(--font-display);font-weight:700;font-size:10.5px;color:var(--ink)}
  body.printing #trayectoria .tl-org{
    display:block;font-size:7.8px;color:var(--ink-soft);margin-top:0}
  /* roles desplegados: muestran su detalle (sin colores, solo negrita) */
  body.printing #trayectoria .tl-detail{display:none}
  body.printing #trayectoria .tl-card.open .tl-detail{
    display:block !important;max-height:none !important;opacity:1 !important;margin-top:3px !important}
  body.printing #trayectoria .tl-card.open .tl-detail ul{margin:0;padding-left:13px}
  body.printing #trayectoria .tl-card.open .tl-detail li{
    font-size:7.6px;line-height:1.4;margin-bottom:2px;color:var(--ink)}
  body.printing #trayectoria .tl-card.open .tl-detail .hit{
    background:none !important;color:var(--ink) !important;font-weight:700;padding:0}
  body.printing #trayectoria .tl-card.open .tl-tags{display:none}
  body.printing #trayectoria .tl-item.is-now::after{display:none !important}

  /* ── SKILLS: arrancan en la 2ª hoja · una sola línea de 5 clusters ── */
  body.printing #skills{break-before:page;page-break-before:always}
  body.printing #skills .cluster-grid.print-only{grid-template-columns:repeat(5,1fr);gap:9px}
  body.printing #skills .cluster{padding:10px 11px;border-radius:10px}
  body.printing #skills .cluster h3{font-size:8.6px;margin-bottom:8px;gap:6px;letter-spacing:.02em}
  body.printing #skills .cluster h3 svg{width:12px;height:12px}
  body.printing #skills .skill{margin-bottom:6px}
  body.printing #skills .skill:last-child{margin-bottom:0}
  body.printing #skills .skill .row{font-size:7.6px;margin-bottom:3px;gap:6px}
  body.printing #skills .skill .row em{font-size:6.8px}
  body.printing #skills .bar{height:3.5px}

  /* ── EDUCATION & LANGUAGES: lado a lado (como la web), con aire ── */
  body.printing #formacion .edu-twocol{display:grid !important;
    grid-template-columns:1.7fr 1fr !important;gap:28px;align-items:start}
  body.printing #formacion .edu-twocol > div:first-child{columns:2;column-gap:22px}
  body.printing #formacion .edu-twocol > div:first-child > h3{column-span:all;margin-bottom:9px}
  body.printing #formacion .edu-twocol > div:last-child > h3{margin-bottom:9px}
  body.printing #formacion h3{font-size:10px;letter-spacing:.1em}
  body.printing #formacion .edu-item{margin-bottom:8px;padding-left:13px}
  body.printing #formacion .edu-item .y{font-size:8px}
  body.printing #formacion .edu-item .t{font-size:9.6px;margin:1px 0}
  body.printing #formacion .edu-item .d{font-size:8.2px;line-height:1.35}
  body.printing #formacion .lang-wrap{gap:9px}
  body.printing #formacion .lang-item{margin-bottom:0}
  body.printing #formacion .lang-item .row{font-size:9px;margin-bottom:3px}
  body.printing #formacion .dots i{width:8px;height:8px}

  /* ── PROFILE & EXTRAS: compacto y aireado ── */
  body.printing #extra .values-line{font-size:8.8px;padding:8px 12px;line-height:1.5}
  body.printing #extra .cluster{padding:10px 12px}
  body.printing #extra .cluster h3{font-size:9.5px;margin-bottom:7px}
  body.printing #extra .list-clean{gap:5px}
  body.printing #extra .list-clean li{font-size:8px;line-height:1.4}
  body.printing #extra .chips{gap:5px;margin-top:5px}
  body.printing #extra .chips .chip{font-size:7.4px;padding:3px 7px}

  /* pie + cierre del CV impreso */
  body.printing footer{margin-top:6px}
  body.printing #extra{margin-bottom:0}
  body.printing #extra .cluster{padding:8px 11px}
  body.printing #extra .chips{gap:4px;margin-top:4px}
  body.printing #extra .chips .chip{font-size:7.2px;padding:2px 6px}
  body.printing .print-close{
    display:block;width:100%;margin-top:6px;padding-top:6px;
    border-top:.5px solid var(--line);
    font-family:var(--font-mono);font-size:8px;color:var(--ink-soft);
    text-align:center;letter-spacing:.04em;line-height:1.5}
  body.printing .print-close:empty{display:none}
  body.printing .print-close a{color:var(--accent) !important;font-weight:700}
}

/* ════════ MAPA DE VUELO FLOTANTE (Experiencia) ════════ */
#flightMap{
  position:fixed; top:84px; right:26px; width:340px; height:212px;
  z-index:60; pointer-events:none;
  opacity:0; transform:translateY(-10px) scale(.96);
  transition:opacity .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1), filter .55s ease;
  will-change:opacity,transform;
}
#flightMap.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; filter:blur(0); }
#flightMap.dissolve{ opacity:0; transform:translateY(-4px) scale(.99); filter:blur(5px);
  transition:opacity 2.4s ease, transform 2.4s ease, filter 2.4s ease; }
#flightMap .fm-frame{
  position:absolute; inset:0; border-radius:14px; overflow:hidden;
  background:color-mix(in srgb,var(--bg-card) 97%, transparent);
  border:1px solid var(--line);
  box-shadow:0 18px 44px -18px rgba(0,32,91,.42), 0 2px 10px -4px rgba(0,0,0,.18);
  backdrop-filter:blur(11px) saturate(1.05); -webkit-backdrop-filter:blur(11px) saturate(1.05);
}
#flightMap .fm-head{
  position:absolute; top:0; left:0; right:0; height:30px; z-index:3;
  display:flex; align-items:center; gap:7px; padding:0 12px;
  font-family:var(--font-display); letter-spacing:.08em; text-transform:uppercase;
  font-size:10px; color:var(--ink-soft);
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg-card) 92%,transparent),transparent);
}
#flightMap .fm-head .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);}
#flightMap .fm-head .fm-where{margin-left:auto;color:var(--ink);font-weight:700;letter-spacing:.04em;
  text-transform:none;font-size:11px;opacity:0;transition:opacity .4s ease;max-width:170px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:right;}
#flightMap.has-active .fm-head .fm-where{opacity:1;}
#flightMap svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
#flightMap .fm-svg-wrap{position:absolute;inset:0;}
/* viewport group is what we pan/zoom */
#fmViewport{transition:transform 1.15s cubic-bezier(.55,.085,.18,1.02);transform-origin:0 0;}
#flightMap .land{fill:color-mix(in srgb,var(--ink) 8%,transparent);
  stroke:color-mix(in srgb,var(--ink) 16%,transparent);stroke-width:.5;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;transition:fill .5s ease;}
#flightMap .land.hot{fill:color-mix(in srgb,var(--accent) 14%,transparent);}
/* routes */
#flightMap .route{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
#flightMap .route.sec{stroke:color-mix(in srgb,var(--accent) 42%,transparent);
  stroke-width:1;stroke-dasharray:1.6 2.6;opacity:0;transition:opacity .6s ease;}
#flightMap .route.trace{stroke:var(--accent);stroke-width:1.7;
  filter:drop-shadow(0 0 2px color-mix(in srgb,var(--accent) 55%,transparent));
  transition:opacity 1.1s ease;}
#flightMap .route.history{stroke:color-mix(in srgb,var(--accent) 28%,transparent);stroke-width:1.1;
  transition:opacity 1.1s ease;}
#flightMap .route.fade{opacity:0!important;}
/* city nodes */
#flightMap .city{vector-effect:non-scaling-stroke;}
#flightMap .city .ring{fill:none;stroke:var(--accent);stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.0;}
#flightMap .city .core{fill:var(--accent);}
#flightMap .city.on .ring{opacity:.9;animation:fmPulse 1.8s ease-out infinite;}
#flightMap .city.dim .core{fill:color-mix(in srgb,var(--ink) 38%,transparent);}
#flightMap .city .lbl{font-family:var(--font-display);font-size:5.4px;font-weight:700;
  letter-spacing:.04em;fill:var(--ink);paint-order:stroke;
  stroke:color-mix(in srgb,var(--bg-card) 88%,transparent);stroke-width:1.6px;
  opacity:0;transition:opacity .4s ease;}
#flightMap .city.on .lbl{opacity:1;}
@keyframes fmPulse{0%{transform:scale(1);opacity:.85}70%{opacity:0}100%{transform:scale(3.4);opacity:0}}
@media (prefers-reduced-motion:reduce){
  #fmViewport{transition:none!important}
  #flightMap .city.on .ring{animation:none}
}
/* responsive: hide on small screens (timeline already vertical) */
@media (max-width:900px){ #flightMap{display:none!important} }
@media print{ #flightMap{display:none!important} }

let LANG = localStorage.getItem('cv_lang') || 'en';
const LANGS = ['es','en','zh'];
const L = o => {
  if (!(o && typeof o === 'object' && ('es' in o || 'en' in o))) return o;
  if (LANG === 'zh') {
    if ('zh' in o && o.zh) return o.zh;               // traducción inline si existe
    const base = o.es ?? o.en;
    if (base != null && ZH[base]) return ZH[base];     // diccionario por texto español
    return o.en ?? o.es;                               // fallback al inglés
  }
  return o[LANG] ?? o.es;
};

function renderHero(){

  const meta = CV_DATA.contact.map(c=>`<span>${SVG[c.type]||SVG.loc}${L(c.text)}</span>`).join('');
  document.getElementById('heroMeta').innerHTML = meta;
  // contacto directo en texto: WhatsApp · WeChat · LinkedIn · Email (una sola fila)
  const wa = CV_DATA.contactDirect.whatsapp;
  const waHref = 'https://wa.me/' + wa.replace(/[^0-9]/g,'');
  const liShort = CV_DATA.linkedin.replace(/^https?:\/\//,'');
  document.getElementById('heroContact').innerHTML = `
    <a class="contact-chip" href="${waHref}" target="_blank" rel="noopener">
      <span class="ico">${SVG.whatsapp}</span>
      <span class="txt"><b>WhatsApp</b><span>${wa}</span></span>
    </a>
    <div class="contact-chip">
      <span class="ico">${SVG.wechat}</span>
      <span class="txt"><b>WeChat ID</b><span>${CV_DATA.contactDirect.wechat}</span></span>
    </div>
    <a class="contact-chip" href="${CV_DATA.linkedin}" target="_blank" rel="noopener">
      <span class="ico">${SVG.linkedin}</span>
      <span class="txt"><b>LinkedIn</b><span>${liShort}</span></span>
    </a>
    <a class="contact-chip" href="mailto:${CV_DATA.email}">
      <span class="ico">${SVG.mail}</span>
      <span class="txt"><b>Email</b><span>${CV_DATA.email}</span></span>
    </a>`;
  // social (oculto: integrado arriba como chips)
  document.getElementById('heroSocial').innerHTML = '';
  // foot social
  const fs=[];
  if(CV_DATA.linkedin) fs.push(`<a href="${CV_DATA.linkedin}" target="_blank" rel="noopener" title="LinkedIn">${SVG.linkedin}</a>`);
  fs.push(`<a href="mailto:${CV_DATA.email}" title="Email">${SVG.mail}</a>`);
  if(CV_DATA.website && CV_DATA.website!=='[COMPLETAR]') fs.push(`<a href="${CV_DATA.website}" target="_blank" rel="noopener" title="Web">${SVG.web}</a>`);
  document.getElementById('footSocial').innerHTML = fs.join('');
  // frase de cierre (solo PDF) — desactivada
  const pcEl = document.getElementById('printClose');
  if(pcEl){ pcEl.innerHTML = ''; }
  // métricas
  const mEl = document.getElementById('metrics');
  if(!CV_DATA.metrics || !CV_DATA.metrics.length){ mEl.style.display='none'; mEl.innerHTML=''; }
  else { mEl.style.display=''; mEl.innerHTML = CV_DATA.metrics.map(m=>{
    const isNumeric = /^[#\d]/.test(m.num) && m.num.length<=4;
    const lbl = L(m.lbl);
    const cls = (m.wide ? ' wide' : '') + (lbl.length>90 ? ' long' : '');
    return `<div class="metric reveal${cls}">
      <div class="num${isNumeric?'':' txt'}">${m.num}<small>${m.unit||''}</small></div>
      <div class="lbl">${lbl}</div></div>`;
  }).join(''); }
}

/* leyenda de familias usadas en una lista de items */
function legendHTML(items){
  const used = [...new Set(items.map(it=>it.cat).filter(Boolean))];
  return `<div class="cat-legend">`+used.map(c=>
    `<span class="cat-key"><i style="background:${CATS[c].color}"></i>${L(CATS[c])}</span>`
  ).join('')+`</div>`;
}

/* sección con pestañas (cada pestaña es un timeline con código de color) */
function tabsHTML(s){
  const tabsBar = `<div class="tabs-bar" role="tablist">`+s.tabs.map((t,i)=>
    `<button class="tab-btn${i===0?' active':''}" data-tab="${t.key}" role="tab">${L(t.label)}</button>`
  ).join('')+`</div>`;
  // En Trayectoria, anteponemos los logros de la categoría correspondiente
  const logros = (s.id==='trayectoria') ? (CV_DATA.sections.find(x=>x.id==='logros')||null) : null;
  const achFor = key => {
    if(!logros) return '';
    const wanted = key==='airbus' ? 'logros-airbus' : 'logros-propios';
    const lt = logros.tabs.find(t=>t.key===wanted);
    return lt ? `<div class="tab-ach">${achHTML(lt.items)}</div>` : '';
  };
  const panels = s.tabs.map((t,i)=>{
    let body;
    if(t.kind==='ach') body = achHTML(t.items);
    else body = achFor(t.key) + legendHTML(t.items) + tlHTML(t.items);
    return `<div class="tab-panel${i===0?' active':''}" data-panel="${t.key}" data-label="${L(t.label)}">
       ${body}
     </div>`;
  }).join('');
  return tabsBar + `<div class="tab-panels">${panels}</div>`;
}

function tlHTML(items){
  // año de inicio de cada posición (ancla temporal a la izquierda del eje)
  const yearOf = d => { const m = String(d).match(/\d{4}/); return m ? m[0] : ''; };
  const isNow = d => /hoy|now|present|actual/i.test(String(d));
  return `<div class="timeline">
    <span class="tl-axis-cap tl-axis-now">${LANG==='es'?'HOY':'NOW'}</span>`
    +items.map((it,i)=>{
    const c = it.cat ? CATS[it.cat] : null;
    const accent = c ? c.color : 'var(--accent)';
    const catName = c ? L(c) : '';
    const yr = yearOf(it.date);
    const current = i===0 && isNow(it.date);
    const geoAttr = it.geo ? ` data-geo='${JSON.stringify(it.geo)}'` : '';
    return `
    <div class="tl-item reveal${current?' is-now':''}" data-cat="${it.cat||''}" data-tlidx="${i}"${geoAttr} style="--c:${accent}">
      <span class="tl-year">${yr}</span>
      <div class="tl-card${it.open?' open':''}" data-card>
        <div class="tl-top">
          <span class="tl-date">${it.date}</span>
          <span class="tl-role">${L(it.role)}</span>
          <span class="tl-org">${L(it.org)}</span>
          <span class="tl-toggle" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="13" height="13"><path d="M4 6 L8 10 L12 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </div>
        <div class="tl-detail">
          <ul>${L(it.detail).map(d=>`<li>${mdHL(d)}</li>`).join('')}</ul>
          <div class="tl-tags">${c?`<span class="cat-tag" style="--c:${accent}">${catName}</span>`:''}${(it.tags||[]).map(t=>`<span>${t}</span>`).join('')}</div>
        </div>
      </div>
    </div>`;
  }).join('')
    +`<span class="tl-axis-cap tl-axis-start">${yearOf(items[items.length-1]?.date||'')}</span>
      <span class="tl-arrow" aria-hidden="true"></span>
    </div>`;
}

/* ── Carrusel de logros: auto-scroll lento + pausa (hover/scroll) + arrastre ── */
let _scrollPause = false, _scrollTimer = null;
function initCarousels(){
  const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const carousels = [...document.querySelectorAll('[data-carousel]')].map(c=>{
    const track = c.querySelector('.ach-track');
    return { c, track, x:0, hover:false, dragging:false, startX:0, startOffset:0, moved:false };
  });
  if(!carousels.length) return;

  // pausa global mientras el usuario hace scroll de la página
  window.addEventListener('scroll', ()=>{
    _scrollPause = true;
    clearTimeout(_scrollTimer);
    _scrollTimer = setTimeout(()=>{ _scrollPause=false; }, 700);
  }, {passive:true});

  const setX = (o)=>{ o.track.style.transform = `translateX(${o.x}px)`; };
  const half = (o)=> o.track.scrollWidth/2;       // duplicamos los items
  const norm = (o)=>{                              // mantener x dentro de [-half,0)
    const h = half(o); if(h<=0) return;
    while(o.x <= -h) o.x += h;
    while(o.x > 0)   o.x -= h;
  };

  carousels.forEach(o=>{
    // pausa por hover (puntero encima en cualquier momento)
    o.c.addEventListener('pointerenter', e=>{ if(e.pointerType==='mouse') o.hover=true; });
    o.c.addEventListener('pointerleave', e=>{ if(e.pointerType==='mouse') o.hover=false; });

    // arrastre (ratón y táctil) con Pointer Events
    o.c.style.cursor='grab'; o.c.style.touchAction='pan-y';
    o.c.addEventListener('pointerdown', e=>{
      o.dragging=true; o.moved=false;
      o.startX=e.clientX; o.startOffset=o.x;
      o.c.setPointerCapture(e.pointerId);
      o.c.style.cursor='grabbing';
    });
    o.c.addEventListener('pointermove', e=>{
      if(!o.dragging) return;
      const dx = e.clientX - o.startX;
      if(Math.abs(dx)>3) o.moved=true;
      o.x = o.startOffset + dx;
      norm(o); setX(o);
    });
    const endDrag = (e)=>{
      if(!o.dragging) return;
      o.dragging=false; o.c.style.cursor='grab';
      try{ o.c.releasePointerCapture(e.pointerId); }catch(_){}
    };
    o.c.addEventListener('pointerup', endDrag);
    o.c.addEventListener('pointercancel', endDrag);
    // evitar que un arrastre dispare clics/selección
    o.c.addEventListener('click', e=>{ if(o.moved){ e.preventDefault(); e.stopPropagation(); } }, true);
    o.c.addEventListener('dragstart', e=>e.preventDefault());
  });

  if(reduce) return; // sin auto-scroll si el usuario pide menos movimiento
  const SPEED = 0.28; // px/frame ≈ desplazamiento lento
  function step(){
    carousels.forEach(o=>{
      if(o.hover || o.dragging || _scrollPause) return;
      if(half(o)<=0) return;
      o.x -= SPEED; norm(o); setX(o);
    });
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ── Animación de barras + reveal escalonado ── */
function animate(){
  const io = new IntersectionObserver((es)=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
  },{threshold:.12});
  document.querySelectorAll('.reveal').forEach((el,i)=>{
    el.style.transitionDelay=(Math.min(i,8)*0.05)+'s';
    io.observe(el);
  });
  // barras
  const bio = new IntersectionObserver((es)=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.style.width=e.target.getAttribute('data-lvl')+'%'; bio.unobserve(e.target);} });
  },{threshold:.3});
  document.querySelectorAll('.bar i').forEach(b=>bio.observe(b));
}

// Roles que van DESPLEGADOS en el PDF (por fecha-inicio, identificador estable)
const PDF_OPEN_ROLES = ['2024.11','2018.07']; // AOS Expert/Expat · Head of AOS, Performance & Digitalización
let _prevLang = null;
function enterPrintMode(){
  // 1) Forzar inglés (re-render) guardando el idioma actual
  _prevLang = LANG;
  if(LANG!=='en'){ LANG='en'; renderAll(); }
  document.body.classList.add('printing');

  document.querySelectorAll('.sec-head.collapsed').forEach(h=>{h.classList.remove('collapsed');h.parentElement.querySelector('.sec-body').classList.remove('collapsed');});

  document.querySelectorAll('#trayectoria .tl-card').forEach(c=>{

}
function exitPrintMode(){
  document.body.classList.remove('printing');
  if(_prevLang && _prevLang!==LANG){ LANG=_prevLang; renderAll(); }
  _prevLang = null;
}
window.addEventListener('beforeprint', enterPrintMode);
window.addEventListener('afterprint', exitPrintMode);
// Playwright/headless usa emulateMedia sin disparar beforeprint: detectar vía matchMedia
try{ matchMedia('print').addEventListener('change', e=>{ e.matches ? enterPrintMode() : exitPrintMode(); }); }catch(_){}

  }catch(e){} }

  renderAll(); syncCfg();
})();

(function(){

  // quadratic-curve point + tangent for plane heading
  function curve(a,b){
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy);
    // lift control point perpendicular for a nice arc (more arc on long hauls)
    const lift=Math.min(dist*0.28, 26);
    const nx=-dy/(dist||1), ny=dx/(dist||1);
    return {cx:mx+nx*lift, cy:my+ny*lift};
  }
  function qpoint(a,c,b,t){
    const u=1-t;
    return {x:u*u*a.x+2*u*t*c.x+t*t*b.x, y:u*u*a.y+2*u*t*c.y+t*t*b.y};
  }
  function pathD(a,b){const c=curve(a,b);return `M${a.x},${a.y} Q${c.cx},${c.cy} ${b.x},${b.y}`;}

  function build(){

  // Gather timeline items (Airbus panel) that have geo, in chronological order (oldest first)
  function collectOrder(){

    if(!panel)return;
    const items=[...panel.querySelectorAll('.tl-item[data-geo]')];
    // DOM is newest->oldest; reverse to chrono
    order=items.map(node=>{
      let geo=null; try{geo=JSON.parse(node.getAttribute('data-geo'));}catch(e){}
      return {node,geo};
    }).reverse();
  }

  function setRegion(region){
    const r=REGIONS[region]||REGIONS.world;
    // translate so that (cx,cy) sits near center of the 360x180 frame after scale
    const k=r.k;
    curK=k;
    const tx=VB/2 - r.cx*k;
    const ty=VBH/2 - r.cy*k;
    vp.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;
    applyCounterScale();
  }

  // keep city markers, labels and plane at constant on-screen size despite zoom
  function applyCounterScale(){
    const inv=1/curK;
    for(const k in nodes){
      const g=nodes[k];
      g.setAttribute('transform',`translate(${g.dataset.x},${g.dataset.y}) scale(${inv})`);
    }
  }

  function clearActiveCities(){
    for(const k in nodes){nodes[k].classList.remove('on');nodes[k].classList.remove('dim');}
  }
  function clearSecRoutes(){[...routesG.querySelectorAll('.route.sec')].forEach(r=>r.remove());}

  // animate plane from A to B along the curve
  

  // draw a route A->B. opts: {draw:true} animates stroke draw-on; returns path
  function drawTrace(a,b,cls,opts){
    opts=opts||{};
    const p=el('path',{class:'route '+(cls||'trace'),d:pathD(a,b)});
    routesG.appendChild(p);
    if(opts.draw){
      // robust draw-on: pad dasharray slightly so the far end never leaves a gap
      const len=p.getTotalLength()+2;
      p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
      p.getBoundingClientRect();
      p.style.transition='stroke-dashoffset 1.1s cubic-bezier(.55,.085,.18,1.02)';
      p.style.strokeDashoffset=0;
      // after draw completes, clear the dash so the whole line is solid & continuous
      setTimeout(()=>{ p.style.strokeDasharray='none'; p.style.strokeDashoffset='0'; }, 1180);
    }
    return p;
  }

  // remove every route currently on the map (used so only the latest trip shows)
  function clearAllRoutes(){ while(routesG.firstChild) routesG.removeChild(routesG.firstChild); }
  // fade out + remove the routes belonging to a given list after a delay
  function scheduleRouteFade(paths, delay){
    setTimeout(()=>{
      paths.forEach(p=>{ if(p && p.parentNode){ p.classList.add('fade');
        setTimeout(()=>{ if(p.parentNode) p.parentNode.removeChild(p); }, 1200); } });
    }, delay);
  }

  const ROUTE_LINGER_MS=2000;   // routes stay this long, then fade leaving only nodes

  function activate(idx,{fly=true}={}){
    if(idx<0||idx>=order.length)return;
    if(idx===activeIdx)return;
    const prev=activeIdx>=0?order[activeIdx]:null;
    activeIdx=idx;
    const cur=order[idx];
    if(!cur.geo){return;}
    const geo=cur.geo;

    // zoom to region (sets curK)
    setRegion(geo.region);
    map.classList.add('has-active');

    // only the latest trip's routes should ever be visible
    clearAllRoutes();

    // city emphasis
    clearActiveCities();
    const dest=CITIES[geo.loc];
    if(nodes[geo.loc]) nodes[geo.loc].classList.add('on');
    visited.add(geo.loc); if(nodes[geo.loc])nodes[geo.loc].classList.add('seen');

    // dual main destination (e.g. 2016 Broughton)
    if(geo.dual){geo.dual.forEach(d=>{ if(nodes[d]){nodes[d].classList.add('on');visited.add(d);nodes[d].classList.add('seen');} });}

    const tripRoutes=[];   // routes to fade after linger

    // secondary dashed routes (network roles) — part of this trip, fade with the rest
    if(geo.sec){geo.sec.forEach(s=>{ if(CITIES[s]){
      const r=drawTrace(dest,CITIES[s],'sec'); requestAnimationFrame(()=>r.style.opacity=1);
      tripRoutes.push(r);
    }});}

    // where label
    whereEl.textContent = dest ? dest.name : '';

    // route from previous active destination -> current (no plane; line draws then fades)
    if(fly && prev && prev.geo && CITIES[prev.geo.loc] && dest){
      const A=CITIES[prev.geo.loc], B=dest;
      tripRoutes.push(drawTrace(A,B,'trace',{draw:true}));
      if(geo.dual){geo.dual.forEach(d=>{ if(CITIES[d]) tripRoutes.push(drawTrace(B,CITIES[d],'trace',{draw:true})); });}
    }else if(dest && geo.dual){
      // first activation with a dual destination: link the two main points
      geo.dual.forEach(d=>{ if(CITIES[d]) tripRoutes.push(drawTrace(dest,CITIES[d],'trace',{draw:true})); });
    }

    // after a couple of seconds, fade the trip routes — only the pulsing destinations remain
    scheduleRouteFade(tripRoutes, ROUTE_LINGER_MS);
  }

  // ── show / hide controller: hover-driven + 7s inactivity auto-hide ──
  let shown=false;
  let hideTimer=null;
  const IDLE_MS=7000;

  function showMap(){
    if(!shown){ shown=true; map.classList.remove('dissolve'); map.classList.add('show'); }
  }
  function hideMap(){
    if(shown){ shown=false; map.classList.remove('show'); map.classList.add('dissolve');
      setTimeout(()=>{ if(!shown) map.classList.remove('dissolve'); }, 2500); }
  }
  function armIdle(){
    clearTimeout(hideTimer);
    hideTimer=setTimeout(hideMap, IDLE_MS);
  }
  function poke(idx){
    showMap();
    if(typeof idx==='number' && idx>=0) activate(idx,{fly:true});
    armIdle();
  }

  function wireHovers(){
    order.forEach((o,idx)=>{
      o.node.addEventListener('mouseenter',()=>poke(idx));
      o.node.addEventListener('focusin',()=>poke(idx));
      o.node.addEventListener('mousemove',armIdle,{passive:true});
    });
    // hovering the map itself keeps it alive
    map.addEventListener('mouseenter',()=>{ clearTimeout(hideTimer); showMap(); });
    map.addEventListener('mousemove',armIdle,{passive:true});
    map.addEventListener('mouseleave',armIdle);
  }

  // safety: if the whole section scrolls out of view, hide immediately
  function observe(){
    const sec=document.getElementById('trayectoria'); if(!sec)return;
    const io=new IntersectionObserver(entries=>{
      entries.forEach(en=>{ if(!en.isIntersecting){ clearTimeout(hideTimer); hideMap(); } });
    },{threshold:[0]});
    io.observe(sec);
  }

  // boot after main render
  function boot(){
    if(!document.getElementById('flightMap'))return;
    if(!document.querySelector('#trayectoria .tl-item[data-geo]')){ setTimeout(boot,180); return; }
    build();
  }
  if(document.readyState==='complete'||document.readyState==='interactive'){setTimeout(boot,250);}
  else document.addEventListener('DOMContentLoaded',()=>setTimeout(boot,250));
  // re-collect order when language toggles (timeline re-renders)
  document.addEventListener('cv:rerender',()=>{ setTimeout(()=>{ if(map){collectOrder();wireHovers();} },120); });
})();

</script>
</body>
</html>
